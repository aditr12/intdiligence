# gcloud builds submit --config cloudbuild.yaml --substitutions=_API_URL=https://... .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_API_URL=${_API_URL}", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/intdiligence/frontend:latest
  _API_URL: http://localhost:8000
options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
timeout: 1800s
